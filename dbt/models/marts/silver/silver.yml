version: 2

models:
  - name: silver_repositories_current
    description: >
      Current-state view of repositories (SCD2, dbt_valid_to is null) with data quality tagging.
      Clean records from snapshot + quarantined records from intermediate layer.
      Downstream Gold should filter WHERE is_quarantined = false.
    columns:
      - name: repository_id
        tests: [unique, not_null]
      - name: full_name
        tests: [not_null]
      - name: is_quarantined
        tests: [not_null]
        description: "True if any DQ rule failed for this record"
      - name: dq_failed_rules
        description: "Array of failed DQ rule names (empty array if clean)"

  - name: silver_issues_current
    description: >
      Current-state issues excluding PR-issues (is_pull_request = false) with data quality tagging.
      Clean records from snapshot + quarantined records from intermediate layer.
      Downstream Gold should filter WHERE is_quarantined = false.
    columns:
      - name: issue_id
        tests: [unique, not_null]
      - name: repository_url
        tests: [not_null]
      - name: is_quarantined
        tests: [not_null]
        description: "True if any DQ rule failed for this record"
      - name: dq_failed_rules
        description: "Array of failed DQ rule names (empty array if clean)"

  - name: silver_pull_requests_current
    description: >
      Current-state pull requests (SCD2, dbt_valid_to is null) with data quality tagging.
      Clean records from snapshot + quarantined records from intermediate layer.
      Downstream Gold should filter WHERE is_quarantined = false.
    columns:
      - name: pull_request_id
        tests: [unique, not_null]
      - name: is_quarantined
        tests: [not_null]
        description: "True if any DQ rule failed for this record"
      - name: dq_failed_rules
        description: "Array of failed DQ rule names (empty array if clean)"

  - name: silver_releases
    description: >
      Releases (Type 1 incremental merge, no SCD2) with data quality tagging.
      All records (clean + quarantined) in a single table.
    columns:
      - name: release_id
        tests: [unique, not_null]
      - name: tag_name
        tests: [not_null]
      - name: is_quarantined
        tests: [not_null]
        description: "True if any DQ rule failed for this record"
      - name: dq_failed_rules
        description: "Array of failed DQ rule names (empty array if clean)"

  - name: silver_languages
    description: >
      Languages per repository, unpivoted from map (Type 1 full overwrite) with data quality tagging.
      All records (clean + quarantined) in a single table.
    columns:
      - name: language
        tests: [not_null]
      - name: bytes
        tests: [not_null]
      - name: is_quarantined
        tests: [not_null]
        description: "True if any DQ rule failed for this record"
      - name: dq_failed_rules
        description: "Array of failed DQ rule names (empty array if clean)"
